version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - elsea_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MYSQL_URL=mysql+aiomysql://elsea:elseapassword@mysql:3306/elsea_db
      - MONGO_URL=mongodb://elsea:elseapassword@mongodb:27017/elsea_db?authSource=admin
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
      - JWT_SECRET=supersecretjwtkey_change_in_production
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elsea_network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - MYSQL_URL=mysql+aiomysql://elsea:elseapassword@mysql:3306/elsea_db
      - MONGO_URL=mongodb://elsea:elseapassword@mongodb:27017/elsea_db?authSource=admin
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - backend
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - elsea_network

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: elsea_db
      MYSQL_USER: elsea
      MYSQL_PASSWORD: elseapassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - elsea_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mongodb:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: elsea
      MONGO_INITDB_ROOT_PASSWORD: elseapassword
      MONGO_INITDB_DATABASE: elsea_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - elsea_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - elsea_network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - elsea_network

networks:
  elsea_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  qdrant_data:
  redis_data:
